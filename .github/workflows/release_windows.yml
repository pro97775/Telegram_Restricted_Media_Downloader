name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python 3.13.2
      uses: actions/setup-python@v6
      with:
        python-version: '3.13.2'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Extract metadata
      shell: bash
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        CLEAN_VERSION=${TAG_NAME#v}
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
        echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV

    - name: Build
      shell: bash
      env:
        PYTHONIOENCODING: UTF-8
      run:
        python build.py --disable-cache=all --remove-output

    - name: Prepare release files
      shell: bash
      run: |
        mkdir -p "release/Documentation"
        cp "output/TRMD.exe" "release/TRMD.exe"
        cp "res/User_Guide.pdf" "release/Documentation/User_Guide.pdf"
        cp "res/FAQ.pdf" "release/Documentation/FAQ.pdf"
        cd release
        "../res/bin/rar.exe" a "TRMD_${{ env.CLEAN_VERSION }}-windows-64.rar" "TRMD.exe" "Documentation"
        rm -rf "Documentation"

    - name: Upload release asset to GitHub
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TAG_NAME }}
        files: release/*
